name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, Clippy, and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run Clippy with all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run no-hardware tests
        run: cargo test --locked --workspace --all-targets

      - name: Run no-hardware tests with all features
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Run doc tests
        run: cargo test --locked --doc

      - name: Run doc tests with all features
        run: cargo test --locked --doc --all-features

      - name: Check public API docs
        run: cargo doc --locked --no-deps --all-features
