[package]
name = "hydrasdr-rs"
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.88"
description = "Rust-native HydraSDR RFOne driver built on nusb."
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/hydrasdr-rs"
keywords = ["hydrasdr", "sdr", "usb", "rfone", "nusb"]
categories = ["hardware-support", "api-bindings", "asynchronous"]

[features]
default = []
tokio = ["nusb/tokio"]
smol = ["nusb/smol"]

[dependencies]
nusb = "0.2.6"

[dev-dependencies]
futures-lite = "2"
